<section class="detail-page">
  <div class="container">
    <a href="index.html" class="back-link">← Zurück zur Startseite</a>
    <h1>Kontakt</h1>
    <p class="intro">Schreib uns eine Nachricht, wir melden uns schnellstmöglich zurück.</p>

    <form action="https://formspree.io/f/DEIN-CODE-HIER" method="POST" class="contact-form">
      <label for="email">Deine E-Mail-Adresse *</label>
      <input type="email" id="email" name="email" required>

      <label for="service">Welche Dienstleistung interessiert dich? *</label>
      <select id="service" name="service" required>
        <option value="">Bitte wählen</option>
        <option value="Basic Paket">Basic Paket</option>
        <option value="Plus Paket">Plus Paket</option>
        <option value="Premium Paket">Premium Paket</option>
        <option value="Außenreinigung">Außenreinigung</option>
        <option value="Innenreinigung">Innenreinigung</option>
        <option value="Extras">Extras</option>
        <option value="Sonstiges">Sonstiges / weiß noch nicht</option>
      </select>

      <label for="message">Deine Nachricht *</label>
      <textarea id="message" name="message" rows="5" required></textarea>

      <label for="termin">Wunschtermin (optional)</label>
      <input type="text" id="termin" name="wunschtermin" placeholder="z. B. nächste Woche Dienstag oder Mittwoch">

      <div class="privacy-check">
        <input type="checkbox" id="privacy" name="privacy" required>
        <label for="privacy">Ich habe die <a href="datenschutz.html" class="inline-link">Datenschutzerklärung</a> gelesen und bin einverstanden. *</label>
      </div>

      <button type="submit" class="btn">Nachricht senden</button>
    </form>
  </div>
</section>
